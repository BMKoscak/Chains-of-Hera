 story:{chapter:'Chapter I: The Burning of Thebes',obj:'Find Tiresias in the agora',
  intro:['When the gods quarrel, it is mortals who bleed.',
   'Zeus, king of Olympus, has fallen silent. His queen Hera and his son Ares, god of war, have bound him in chains that no god can break.',
   'With the Thunderer gone, the raiders of Ares burn their way across Greece, and Hera wakes monsters that have slept since the world was young.',
   'Only one hero is half mortal and half god, and Hera has hated him since the day he was born. His name is Heracles.'],
  outro:'The north gate stands open. Beyond it lies the road to Nemea, and the Lion.',
  npcs:[
   {id:'iolaus',name:'Iolaus',x:8.6,z:88,yaw:-Math.PI/2,look:LOOK.iolaus,
    lines:["Uncle! You saw the smoke too? Ares' raiders hit Thebes at dawn. Red cloaks, bronze helmets. Ares' men, no question.",
     "There are two of them looting the old farmhouse right there. After that, follow the road over the river into town.",
     "Old Tiresias will know what's going on. Find him in the agora. I'll circle round the farms and get the families out.",
     "And Uncle, try to leave a few raiders for me, would you?"],
    again:["The agora is past the bridge, through the village. I'll catch up with you."]},
   {id:'melia',name:'Melia',x:-7.6,z:37.4,yaw:Math.PI/2,look:{skin:0xd8a682,hair:0x3a2416,body:0x3a6aa8,legs:0x3a6aa8,robe:1,long:1},
    lines:["They set the houses on fire when they couldn't find any silver. Watch your step, the flames are still burning.","They smashed our jars out of spite. Some of the old ones still have drachmas hidden inside."]},
   {id:'nikos',name:'Nikos',x:6.4,z:14,yaw:-Math.PI/2,look:{skin:0xd9a070,hair:0x2a1a10,body:0x5a8a3a,legs:0x6a4a2a,sc:.68},
    lines:["Are you really Heracles? My father says you can lift an ox over your head!","There's a raider archer on the roof of the baker's house. You can climb up the stairs on the side, I do it all the time."]},
   {id:'dimos',name:'Dimos',x:10.4,z:-3,yaw:-Math.PI/2,look:{skin:0xc8906a,hair:0x1a1410,body:0xc87a2a,legs:0x5a3a20,beard:0x1a1410,belly:1},
    lines:["Ares' men took my best wine and paid me with a punch in the nose.","If you're going after them, the temple of Zeus keeps a bronze sword on its altar. The priestess won't mind. Probably."]},
   {id:'tiresias',name:'Tiresias',x:3.6,z:-1,yaw:-2.4,look:LOOK.elder,
    lines:["Son of Zeus. I heard your footsteps on the bridge. My eyes have been dark for many years, but I still see.",
     "Your father lies chained in the deepest vault of Olympus. Hera forged the chains. Ares stands guard over them.",
     "Hera will send her beasts against you, one after another. The first waits in Nemea: a lion whose hide turns any blade.",
     "Ares' raiders hold the north quarter. They have dug a burning ditch before the gate so no runner can warn the other cities.",
     "I have told the people to pull down the barricade. Cross the camp, get over the burning ditch, and take the road to Nemea. If the ditch is too wide, the old wall walk on the west side runs above it."],
    again:["The gods are watching you, Heracles. One of them is hoping you fail."],done:"flag:tiresias;open;obj:Cross Ares' camp and reach the north gate"},
   {id:'ianthe',name:'Ianthe',x:-19,z:-2.8,y:1.5,yaw:Math.PI/2,look:LOOK.priestess,
    lines:["The altar of Zeus has been cold for nine days. Even the sacred flame will not light.",
     "Take the bronze sword from the altar. Zeus would want it raised against the men who desecrate his city.",
     "And if you are the curious sort: last winter's earthquake brought down the old columns behind the temple. Someone nimble could climb to the roof, where the offerings were once kept."]}]}},

 story:{chapter:'Chapter II: The Forest of Nemea',obj:'Find Molorchus the shepherd',
  intro:['The road north from Thebes climbs into the hills of Nemea, where the forest grows so thick that noon looks like dusk.',
   'For a year a lion has hunted these woods. Arrows break against its golden hide, and no shepherd will graze his flock beyond the old shrine.',
   'Hera sent the beast. Now she sends her servants after Heracles as well: brigands paid in temple gold, and satyrs who serve anyone who brings them wine.'],
  outro:'The trail ends at a cave that smells of blood and old bones. Deep inside, something enormous is breathing.',
  npcs:[
   {id:'molorchus',name:'Molorchus',x:-22.6,z:41,yaw:Math.PI/2,look:{skin:0xc8906a,hair:0x8a8478,body:0x7a5a3a,legs:0x5a4a3a,beard:0x9a9488},
    lines:["A traveller? Here? Sit, sit. I'm only a poor shepherd, but you're welcome to what I have.","Heracles! Then the gods haven't forgotten us. The lion took my son's flock, and then it took my son.",
     "Take his shield. Bronze, from Argos. Hold it up and the beast's claws will slide right off it.","The den is past the ravine, beyond the hunters' camp, up on the lion's ridge. Cross the ravine on the old rafts, and watch for satyrs in the woods."],
    again:["Bring back the lion's hide and I'll sacrifice my best ram to Zeus. Well. My only ram."],done:'give:shield;obj:Cross the ravine and find the lion\'s den'},
   {id:'kleon',name:'Kleon',x:26,z:-35,yaw:-Math.PI/2,look:{skin:0xc8906a,hair:0x3a2a1a,body:0x4a6a3a,legs:0x5a4a30,beard:0x3a2a1a},
    lines:["You made it across the ravine? I fell in on my first try. Climbed out by the old rockfall on the north side.","While I was down there I saw something shining on a stone pillar, east along the ravine floor. Gold, I'd swear it.","The brigands up the ridge are working for someone. Paid in temple coin, the kind they mint at Hera's sanctuary in Argos."]}]}},

 story:{chapter:'Chapter III: The Swamp of Lerna',obj:'Light the three signal beacons around the swamp',
  intro:['With the Lion of Nemea defeated, Heracles wears its golden hide. No blade or claw can pierce it now.',
   'Hera answers by waking the oldest thing in her service: the Hydra, the many-headed serpent of the Lernaean swamp.',
   'Its lair lies beneath a drowned temple of Hera, sealed long ago by the priests who fled the swamp.'],
  outro:'The seal breaks with a sound like a breaking wave. Below the temple, something with many heads stirs in the dark water.',
  npcs:[
   {id:'iolaus3',name:'Iolaus',x:4,z:86,yaw:Math.PI,look:LOOK.iolaus,
    lines:["Uncle! Over here! I got your message from Nemea. A lion skin cloak, very stylish.",
     "The Hydra's lair is under Hera's drowned temple, north across the marsh. The doors are sealed with old magic. Only the three signal beacons can break it.",
     "One stands on the fishermen's watchtower to the west. One is on an island past the sunken columns to the east. The last is by Hera's statue on the western lake.",

 draw(camera){
  const x=this.x,W=G.w,H=G.h;x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,W,H);

  if(G.debug)this.label(G.fps+' fps  '+Player.tris+' tris',W-12,H-18,10,'right','#c8ffc8',600);

  if(Player.dead)this.text('YOU DIED',W/2,H/2-30,40,'center');

   x.save();x.translate(sx,sy);x.rotate(t);x.strokeStyle='#000';x.lineWidth=5;x.beginPath();for(const q of[0,1,2,3]){x.rotate(Math.PI/2);x.moveTo(s,s*.2);x.lineTo(s,s);x.lineTo(s*.2,s)}x.stroke();
   x.strokeStyle='#ffe060';x.lineWidth=2.5;x.stroke();x.restore()}}
  if(G.mode==='talk'){this.dialog();return}

  if(!Input.locked&&!Input.gp){const t='Click the game to capture the mouse',w=this.width(t,13)+28;this.box(W/2-w/2,H/2-84,w,26,.6);this.label(t,W/2,H/2-79,13,'center','#ffe7a8',600)}

};

/* ===== GAME: chapters, loading, rewards, saving ===== */
const Game={order:['village','forest','lerna','labyrinth','underworld','olympus'],idx:0,sel:0,
 save:{unlocked:1,drachmas:0,sword:false,shield:false,gsword:false,vigor:0,amph:{}},
 ENDING:['Heracles tears the last link of Hera\'s chain apart, and thunder rolls across the sky for the first time in a season.',
  'Zeus rises from the vault. Ares flees to Thrace, and Hera, for once, says nothing at all.',
  'In Thebes, Tiresias smiles at a sound only he can hear. In Nemea, a shepherd lights a fire on the old shrine. Somewhere on the road, Iolaus is already telling the story wrong.',
  'Thank you for playing. Everything you saw and heard (models, textures, music and sound) was generated in code. Inspired by the myths of ancient Greece.'],
 loadSave(){try{const s=JSON.parse(localStorage.getItem('chains_of_hera_save_v1')||'null');if(s)Object.assign(this.save,s)}catch(e){}this.sel=clamp(this.save.unlocked-1,0,this.order.length-1)},
 store(){try{localStorage.setItem('chains_of_hera_save_v1',JSON.stringify(this.save))}catch(e){}},
 load(id,skipCard){const L=LEVELS[id];this.id=id;this.idx=this.order.indexOf(id);if(this.idx<0)this.idx=0;
  while(scene.children.length)scene.remove(scene.children[0]);
  World.reset();Level.reset();Enemies.list=[];Props.list=[];Breakables.list=[];Breakables.chunks=[];Pick.list=[];Proj.list=[];FX.reattach(scene);
  const S=this.save;G.maxHp=100+25*(S.vigor||0);Object.assign(G,{hp:G.maxHp,kills:0,time:0,amph:false,hitstop:0,flash:null,drachmas:S.drachmas||0,coinsStart:S.drachmas||0,sword:!!S.sword,shield:!!S.shield,gsword:!!S.gsword,hints:G.hints>0?25:0});
  Object.assign(Player,{dead:false,deadT:0,stun:0,busy:false,atkOn:false,chg:0,carry:null,rollT:0,inv:0,respawn:null,wet:false,wasWet:false,jumps:0,onG:false,gb:null});Player.vel.set(0,0,0);
  World.build(L,scene,renderer);scene.add(Player.mesh,Player.shadow);Player.spawn();Player.prev.copy(Player.pos);
  Cam.lock=null;Cam.shake=0;Audio.setTheme(World.lvl.music);Story.init(World.lvl,skipCard);if(G.mode==='play')HUD.msg(World.lvl.name)},
 grant(k,pos){const p=pos||Player.pos,S=this.save;
  if(k==='sword'){G.sword=S.sword=true;HUD.msg('Bronze sword of Zeus');Audio.sfx('sword');FX.sparkle(p,0xe8f0ff,24)}
  else if(k==='shield'){G.shield=S.shield=true;HUD.msg('Bronze shield: blocking stops all damage');Audio.sfx('sword');FX.sparkle(p,0xffd890,24)}
  else if(k==='gsword'){G.gsword=G.sword=S.gsword=S.sword=true;HUD.msg('Golden sword of Daedalus: +50% damage');Audio.sfx('sword');FX.sparkle(p,0xffd040,30)}
  else if(k==='vigor'){S.vigor=(S.vigor||0)+1;G.maxHp+=25;G.hp=G.maxHp;HUD.msg('Olive wreath: +25 maximum health');Audio.sfx('heart');FX.sparkle(p,0x9ad060,30)}
  FX.ring(Player.pos,0xffe8b0,3.5,.5);this.store()},
 complete(){const S=this.save,id=this.order[this.idx];S.unlocked=Math.max(S.unlocked,Math.min(this.order.length,this.idx+2));S.drachmas=G.drachmas;S.amph[id]=S.amph[id]||G.amph;this.store()},
 next(){if(this.idx<this.order.length-1){this.sel=this.idx+1;this.load(this.order[this.idx+1])}else{G.mode='ending';Story.endPage=0;Story.pt=0;Level.done=false;Audio.sting('victory');Voice.play('ending_0.mp3',1200)}}
};

/* ===== RENDERER, RESIZE, LOOP ===== */
const wrap=document.getElementById('w'),glc=document.getElementById('gl'),hudc=document.getElementById('hud');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,4/3,.3,320);
function setRes(){
 G.w=G.wide?854:640;G.h=480;renderer.setSize(G.w,G.h,false);hudc.width=G.w*2;hudc.height=G.h*2;camera.aspect=G.w/G.h;camera.updateProjectionMatrix();FX.setScale(G.h/2/Math.tan(camera.fov*Math.PI/360));fit()}
function fit(){const s=Math.min(innerWidth/G.w,innerHeight/G.h);wrap.style.width=G.w*s+'px';wrap.style.height=G.h*s+'px'}
addEventListener('resize',fit);

Input.init(wrap);HUD.init(hudc);FX.init(scene);Player.buildMesh(scene);Cam.init(camera);setRes();Game.loadSave();
Game.load(location.hash==='#proving'?'proving':Game.order[0]);

let last=performance.now(),acc=0,fa=0,fn=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min((now-last)/1000,.25);last=now;acc+=dt;Input.poll();
 if(Input.consume('wide')){G.wide=!G.wide;setRes()}
 if(Input.consume('hints'))G.hints=G.hints>0?0:1e9;
 if(Input.consume('music'))Audio.toggle();
 if(Input.consume('debug'))G.debug=!G.debug;
 Story.update(dt);
 if(Input.consume('lock')&&G.mode==='play')Cam.toggleLock();
 while(acc>=STEP){acc-=STEP;if(Level.done||G.mode!=='play')continue;if(G.hitstop>0){G.hitstop-=STEP;continue}World.time+=STEP;World.update(World.time);Player.step(STEP);Enemies.update(STEP);Props.update(STEP);Breakables.update(STEP);Proj.update(STEP);Pick.update(STEP);Level.update(STEP)}
 if(G.hints>0&&G.mode==='play')G.hints-=dt;
 const a=acc/STEP,t=now/1000;Player.render(a,dt);World.renderMovers(a);Enemies.render(dt);Props.render();Breakables.render(dt);Pick.render(t);Level.render(t);if(G.mode==='play'){if(Level.done){Level.doneT=(Level.doneT||0)+dt;if(Level.doneT>.8&&Input.consume('confirm'))Game.next()}else Input.consume('confirm')}
 if(G.mode==='intro'||G.mode==='ending')Story.introCam(dt,camera);else Cam.update(dt,Player.rp);
 Trees.uT.value=t;Trees.uP.value.set(Player.rp.x,Player.rp.y+1,Player.rp.z);Trees.uC.value.copy(camera.position);
 World.torches.forEach((f,i)=>{f.scale.set(1.2+Math.sin(t*9+i)*.12,1.5+Math.sin(t*13+i*2)*.2,1)});
 for(const w of World.waterTex)w.offset.set(t*.02,t*.035);if(World._wm)World._wm.map.offset.set(t*.03,t*.05);
 FX.update(dt);Audio.update(dt);Sky.update(camera,dt);
 renderer.render(scene,camera);HUD.draw(camera);
 fa+=dt;fn++;if(fa>=.5){G.fps=Math.round(fn/fa);fa=fn=0}
}
requestAnimationFrame(frame);
</script></body></html>
